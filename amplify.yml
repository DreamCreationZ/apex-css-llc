version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci
    build:
      commands:
        - env | grep -e NEXT_PUBLIC_SITE_URL -e SES_REGION -e CONTACT_FORM_RECIPIENT -e CONTACT_FORM_SENDER >> .env.production
        - npm run typecheck
        - npm run lint
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
